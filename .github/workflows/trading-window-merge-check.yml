name: Trading-window merge check

# alpha-engine-config-I12640, option 2: the post-merge DETECTOR.
#
# The run rule (change-control-policy § Merge permission; Brian 2026-10-16):
# no trading-path merge lands 09:00-16:30 America/New_York on an NYSE trading
# day (13:00-20:30Z EDT, 14:00-21:30Z EST; alpha-engine-config-I12769). Until this existed only the merging session enforced it, and nothing
# flagged crucible-executor#621 merging at 20:12Z on Fri 2026-10-23.
#
# What it watches: this repo's main (on push, so a merge here pages within a
# minute) and crucible-trader's main (on the hourly schedule — crucible-trader
# is public and holds no AWS identity, so it cannot page for itself; adding
# one would widen an IAM trust policy). The detector is
# scripts/trading_window_merge_check.py; its window and calendar logic are in
# tests/test_trading_window_merge_check.py.
#
# Prevention (a required trading-window check under a merge queue) is option
# 1 on the same issue: a repo-admin settings change. This job is the backstop
# for it, not a replacement.
#
# Not a required check and no pull_request trigger, so the merge queue is not
# involved (merge-group-required-check-guard has nothing to require here).
# Cost: one ~1-minute run per weekday hour 13-22Z, plus one per push. The
# 22:05Z run (70-minute lookback) covers the EST window's 21:05-21:30Z tail.

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 13-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading-window-merge-check
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"

      # Runner-only install. 0.59.81 is the first krepis whose publish()
      # takes auto_fix / resolution (krepis#262); the executor's own
      # requirements pin is untouched by this job.
      - name: Install krepis
        run: python -m pip install --quiet "krepis==0.59.81"

      # TELEGRAM COMES FROM SSM THROUGH OIDC, NEVER FROM GITHUB SECRETS
      # (Brian's standing rule; alpha-engine-config-I12640). krepis resolves
      # both values through get_secret: SSM /alpha-engine/<NAME> first, then
      # the environment. The publishing role below holds no read on those
      # parameters (and has ~26 bytes of inline headroom), so this job first
      # assumes github-actions-trading-window-page, a read-only role whose
      # trust admits only this workflow file on main and whose one grant is
      # ssm:GetParameter on the two values (nous-ergon-ops
      # infrastructure/iam/github-actions-trading-window-page/). On 10-26,
      # without a channel, crucible-executor#627 (merged 15:04Z) was detected,
      # logged TELEGRAM_BOT_TOKEN=MISSING TELEGRAM_CHAT_ID=MISSING, and the job
      # stayed green.
      #
      # Both reader steps are continue-on-error so the detector still runs
      # and SNS still gets the page; the script then exits 1 on the missing
      # channel, so a broken read is a red run, never a silent one. This repo
      # is public: the values are masked before they reach GITHUB_ENV and are
      # never echoed.
      - name: Configure AWS credentials via OIDC (Telegram reader)
        id: telegram_role
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-trading-window-page
          aws-region: us-east-1

      - name: Load the Telegram values from SSM (masked)
        if: steps.telegram_role.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            value=$(aws ssm get-parameter --name "/alpha-engine/${name}" --with-decryption \
              --query Parameter.Value --output text) || { echo "::error::SSM read of /alpha-engine/${name} failed"; continue; }
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::/alpha-engine/${name} holds a line break; not loaded"; continue ;; esac
            if [ -n "$value" ] && [ "$value" != "None" ]; then
              echo "::add-mask::${value}"
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done

      # Same identity this repo's changelog.yml already assumes; it holds
      # sns:Publish on alpha-engine-alerts. No new grant on it.
      - name: Configure AWS credentials via OIDC (publisher)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Page on any in-window trading-path merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/trading_window_merge_check.py \
            --repo nousergon/crucible-executor \
            --repo nousergon/crucible-trader \
            --lookback-minutes 70 \
            --publish
