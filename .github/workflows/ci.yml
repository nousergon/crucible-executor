name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=executor --cov-report=term-missing

      - name: Security audit
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"

  # Lockfile guards. TWO jobs, because they prove DIFFERENT things and the
  # difference is what let requirements.txt drift for weeks
  # (alpha-engine-config-I8309):
  #
  #   lockfile-python-parity   — the committed lock INSTALLS under the SSoT
  #                              Python. Says nothing about whether it still
  #                              corresponds to requirements.in.
  #   lockfile-reproducible    — the committed lock IS what requirements.in
  #                              compiles to. This is the one that catches a
  #                              Dependabot PR that edits the .in and leaves
  #                              the lock (three of them did), and an .in that
  #                              has drifted into being unsatisfiable.
  #
  # The comment here previously claimed the parity job caught .in drift. It
  # never did, and that claim is why nobody looked.
  lockfile-python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: Dry-run install compiled lockfile under SSoT Python
        run: |
          PYVER="$(cat .python-version)"
          echo "Verifying requirements.txt installs cleanly under Python $PYVER"
          uv venv --python "$PYVER" /tmp/lockfile-parity-venv
          uv pip install --python /tmp/lockfile-parity-venv/bin/python -r requirements.txt

  lockfile-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: requirements.txt must be what requirements.in compiles to
        run: bash scripts/check_lock_reproducible.sh

  # The PRODUCER side of the lockfile, exercised on every PR
  # (alpha-engine-config-I9060). `.github/upgrade_lock.sh` is what replaced
  # Dependabot's pip ecosystem here, and it runs on a weekly schedule from
  # another repo — so nothing in this repo's own CI would ever have executed
  # it. A producer nobody runs rots into a script that fails on its first real
  # invocation months later, and a workflow that has never once executed is
  # indistinguishable from one that works (alpha-engine-config-I8729).
  #
  # `--check` runs the exact compile the producer runs, writes nothing and
  # opens nothing. It is a SMOKE TEST, not a gate: it is expected to report
  # `changed=true` most weeks (upstream cuts releases), and it fails only when
  # the producer itself is broken — a syntax error, a flag uv no longer
  # accepts, a requirements.in that does not resolve under --upgrade.
  lockfile-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: The lockfile producer must run
        run: bash .github/upgrade_lock.sh --check

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test, lockfile-python-parity, lockfile-reproducible, lockfile-producer]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@c115e75840c5e210f857107118428beb4a6fdaa8
    secrets: inherit
