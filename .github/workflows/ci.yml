name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So the required context `test` reports on a merge-queue entry; the fleet
  # merge-group required-check guard accepts only this shape
  # (alpha-engine-config-I12731). Without it a queue entry waits forever on `test`.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any rule means the baseline was
      # regenerated to absorb new errors, which is refused.
      # Missing RETURN annotations are not a pyright rule, so ruff's ANN rules run
      # over every source file the PR adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        env:
          # github.base_ref is set only on pull_request; on a merge-queue entry the
          # base is merge_group.base_ref (refs/heads/main), so the ANN and
          # baseline-may-only-shrink checks run there too instead of being skipped.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          pip install --quiet basedpyright==1.40.2 ruff==0.14.14
          basedpyright
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'executor/*.py' 'polygon_client.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi

      - name: Run tests
        run: pytest tests/ -v --cov=executor --cov-report=term-missing

      - name: Security audit
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"

  # Lockfile guards. TWO jobs, because they prove DIFFERENT things and the
  # difference is what let requirements.txt drift for weeks
  # (alpha-engine-config-I8309):
  #
  #   lockfile-python-parity   — the committed lock INSTALLS under the SSoT
  #                              Python. Says nothing about whether it still
  #                              corresponds to requirements.in.
  #   lockfile-reproducible    — the committed lock IS what requirements.in
  #                              compiles to. This is the one that catches a
  #                              Dependabot PR that edits the .in and leaves
  #                              the lock (three of them did), and an .in that
  #                              has drifted into being unsatisfiable.
  #
  # The comment here previously claimed the parity job caught .in drift. It
  # never did, and that claim is why nobody looked.
  lockfile-python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Shrink-only guard against hard-coded account / bucket literals (plan
      # S-04, alpha-engine-config-I12492; clause ENV-NO-LITERALS). The shared
      # check lives in nousergon-lib and is fetched unpinned, as
      # provider-linkage-guard.yml fetches its script. OBSERVE mode: it reports
      # NEW hits and STALE entries against .hardcoded-env-refs-baseline.json and
      # never blocks; continue-on-error also covers a fetch outage. S-16
      # (alpha-engine-config-I12504) makes it enforcing. Stdlib only, ~1-2 s.
      # Removed a literal? Lower the ceiling: python3 hardcoded_env_refs.py --update
      - name: Hard-coded environment references (observe, S-04)
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/hardcoded_env_refs.py" \
            https://raw.githubusercontent.com/nousergon/nousergon-lib/main/scripts/hardcoded_env_refs.py
          python3 "$RUNNER_TEMP/hardcoded_env_refs.py" --repo .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: Dry-run install compiled lockfile under SSoT Python
        run: |
          PYVER="$(cat .python-version)"
          echo "Verifying requirements.txt installs cleanly under Python $PYVER"
          uv venv --python "$PYVER" /tmp/lockfile-parity-venv
          uv pip install --python /tmp/lockfile-parity-venv/bin/python -r requirements.txt

  lockfile-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: requirements.txt must be what requirements.in compiles to
        run: bash scripts/check_lock_reproducible.sh

  # The PRODUCER side of the lockfile, exercised on every PR
  # (alpha-engine-config-I9060). `.github/upgrade_lock.sh` is what replaced
  # Dependabot's pip ecosystem here, and it runs on a weekly schedule from
  # another repo — so nothing in this repo's own CI would ever have executed
  # it. A producer nobody runs rots into a script that fails on its first real
  # invocation months later, and a workflow that has never once executed is
  # indistinguishable from one that works (alpha-engine-config-I8729).
  #
  # `--check` runs the exact compile the producer runs, writes nothing and
  # opens nothing. It is a SMOKE TEST, not a gate: it is expected to report
  # `changed=true` most weeks (upstream cuts releases), and it fails only when
  # the producer itself is broken — a syntax error, a flag uv no longer
  # accepts, a requirements.in that does not resolve under --upgrade.
  lockfile-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: The lockfile producer must run
        run: bash .github/upgrade_lock.sh --check

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test, lockfile-python-parity, lockfile-reproducible, lockfile-producer]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@da7cd5f45eebbe94bd2524a5fa17a3db917ed961
    secrets: inherit
