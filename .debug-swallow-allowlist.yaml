# .debug-swallow-allowlist.yaml -- baseline for tests/test_no_debug_only_swallows.py
# (alpha-engine-config-I10031).
#
# The class this guards: an `except Exception` (or a narrower except clause
# immediately following one, per-site) whose body only records the failure
# at logger.debug(...) or discards it as a bare `pass` -- invisible on every
# executor entrypoint, whose root logger is set to INFO
# (krepis/src/krepis/logging.py:500). Mirrors the shape of
# .provider-linkage-allowlist.yaml (alpha-engine-config-I9295): every entry
# pre-clears a KNOWN site that is not a producer/writer/audit swallow. A new
# site with no entry fails the build. An entry whose `expires` has passed
# fails loudly -- re-justify or remove, never silently re-grandfather. An
# entry that no longer matches anything ALSO fails, so the allowance cannot
# quietly widen after the site it covered is gone or fixed.
#
# `path` + `line` identify the `except` line itself (the line the guard's
# AST walk reports). Every entry requires a `reason` naming (a) the failure
# mode swallowed and (c) the concrete recording surface (or the explicit
# "no recording surface -- carve-out" for a transport/teardown swallow the
# fleet rule's own carve-out clause covers), per
# `~/Development/CLAUDE.md` "Fail loud and fast."

schema_version: 1
entries:
  # ── Telegram / notification transport (main.py) ──────────────────────────
  # (a) the notification transport itself failed. (c) no recording surface
  # needed -- a failed notification must never abort a trading run, and each
  # site's underlying condition is already visible via other logging or an
  # immediately-following raise.
  - path: executor/main.py
    line: 533
